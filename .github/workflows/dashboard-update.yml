name: Dashboard scheduled updates

on:
  schedule:
    # GitHub cron is UTC; these cover 07:00-23:00 Asia/Taipei (UTC+8).
    - cron: "*/5 23 * * *"
    - cron: "*/5 0-14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target (scheduled follows the Zeabur retirement date)"
        type: choice
        default: scheduled
        options:
          - scheduled
          - railway
          - zeabur
          - both

permissions: {}

concurrency:
  group: dashboard-scheduled-updates
  cancel-in-progress: false

jobs:
  plan:
    name: Select active dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.targets.outputs.should_run }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Check Taipei monitoring window and migration date
        id: targets
        shell: python
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'scheduled' }}
        run: |
          import json
          import os
          from datetime import date, datetime, time
          from zoneinfo import ZoneInfo

          def choose_targets(now, manual, requested):
              local_minute = now.time().replace(second=0, microsecond=0, tzinfo=None)
              in_window = time(7, 0) <= local_minute <= time(23, 0)
              targets = ["railway"]
              # Keep Zeabur updating through Nov 30, then use Railway only.
              if now.date() <= date(2026, 11, 30):
                  targets.append("zeabur")
              if manual and requested != "scheduled":
                  targets = ["railway", "zeabur"] if requested == "both" else [requested]
              return manual or in_window, targets

          now = datetime.now(ZoneInfo("Asia/Taipei"))
          should_run, targets = choose_targets(
              now,
              os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch",
              os.environ["REQUESTED_TARGET"],
          )
          settings = {
              "railway": {
                  "target": "railway",
                  "url_secret": "TWSE_RAILWAY_BASE_URL",
                  "token_secret": "TWSE_RAILWAY_UPDATE_TOKEN",
              },
              "zeabur": {
                  "target": "zeabur",
                  "url_secret": "TWSE_DASHBOARD_BASE_URL",
                  "token_secret": "TWSE_DASHBOARD_UPDATE_TOKEN",
              },
          }
          matrix = {"include": [settings[target] for target in targets]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={str(should_run).lower()}\n")
              output.write(f"matrix={json.dumps(matrix)}\n")
          print(f"taipei_now={now.isoformat(timespec='seconds')}")
          print(f"should_run={should_run}; targets={','.join(targets)}")

  update:
    name: Update ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DASHBOARD_TARGET: ${{ matrix.target }}
      DASHBOARD_BASE_URL: ${{ secrets[matrix.url_secret] }}
      UPDATE_TOKEN: ${{ secrets[matrix.token_secret] }}
    steps:
      - name: Update all three caches and report results
        shell: python
        run: |
          import json
          import os
          import subprocess
          from urllib.parse import urlsplit

          target = os.environ["DASHBOARD_TARGET"]
          base_url = os.environ["DASHBOARD_BASE_URL"].rstrip("/")
          token = os.environ["UPDATE_TOKEN"]
          url = urlsplit(base_url)
          if (not token or "\n" in token or "\r" in token
              or url.scheme != "https" or not url.netloc
              or url.username or url.password or url.query or url.fragment):
              raise SystemExit("Missing or invalid dashboard URL/update-token configuration.")

          endpoints = [
              ("material info", "/api/admin/update"),
              ("monthly revenue", "/api/admin/update-monthly-revenue"),
              ("financial report", "/api/admin/update-financial-report"),
          ]
          failed = False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### {target} dashboard updates\n\n")
              summary.write("| Endpoint | HTTP | Result |\n| --- | --- | --- |\n")
              for label, path in endpoints:
                  # Keep API response bodies and raw curl errors out of logs;
                  # upstream errors can include credential-bearing URLs.
                  result = subprocess.run(
                      ["curl", "--silent", "--show-error", "--fail",
                       "--retry", "3", "--retry-delay", "15", "--retry-max-time", "420",
                       "--retry-connrefused", "--connect-timeout", "20", "--max-time", "240",
                       "--request", "POST", base_url + path,
                       "--header", "Authorization: Bearer " + token,
                       "--write-out", "\n%{http_code}"],
                      capture_output=True, text=True,
                  )
                  body, _, status = result.stdout.rpartition("\n")
                  status = status.strip() if status.strip().isdigit() else "unknown"
                  try:
                      payload = json.loads(body)
                  except ValueError:
                      payload = {}
                  ok = (result.returncode == 0 and status == "200"
                        and isinstance(payload, dict) and payload.get("ok") is True)
                  outcome = "success" if ok else "failed"
                  if ok and payload.get("degraded"):
                      outcome = "success (degraded source data)"
                      print(f"::warning::{target}: {label} returned degraded source data.")
                  if ok and payload.get("skipped"):
                      outcome = "success (cooldown; recent update retained)"
                  failed = failed or not ok
                  print(f"{target}: {label}: HTTP {status}, {outcome}")
                  summary.write(f"| {label} | {status} | {outcome} |\n")
                  summary.flush()
          if failed:
              raise SystemExit("One or more update endpoints failed after retries.")
